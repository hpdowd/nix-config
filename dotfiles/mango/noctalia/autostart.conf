# No waybar-restart.sh and no `swaync &`: noctalia-shell is both the bar and the
# notification daemon. Two owners of org.freedesktop.Notifications means the
# second one silently gets nothing. tiling/ and hud/ start both back up.
exec=pkill waybar 2>/dev/null; true
exec=pkill -x dsearch 2>/dev/null; true
exec=pkill -f '^swaync( |$)' 2>/dev/null; true
exec=systemctl --user start noctalia
exec=~/.config/mango/scripts/system/gtk-apply.sh
exec=pgrep '^\.?kdeconnectd' >/dev/null || kdeconnectd
