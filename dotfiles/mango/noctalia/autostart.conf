# noctalia-shell is both the bar and the notification daemon here; tiling runs
# waybar and swaync for the same two jobs. Each mode stops the other's, so this
# file starts neither. swaync survives only as noctalia-start.sh's failure path:
# a mode with no bar AND no notification daemon is the worst outcome available.
# docs/adr/0051.
#
# The kill, the start and the check are ONE script rather than three exec= lines:
# the order matters (the outgoing daemon must release
# org.freedesktop.Notifications before the incoming one claims it) and
# `systemctl start` exits 0 on a unit that is wedged. docs/adr/0022.
exec=~/.config/mango/scripts/modes/noctalia-start.sh
exec=~/.config/mango/scripts/system/gtk-apply.sh
exec=pgrep '^\.?kdeconnectd' >/dev/null || kdeconnectd
