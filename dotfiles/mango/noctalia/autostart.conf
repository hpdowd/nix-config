# noctalia-shell is both the bar and the notification daemon, so this mode kills
# waybar and swaync and does not restart them; tiling/ starts both back
# up. The kill, the start and the check are ONE script rather than three exec=
# lines: the order matters (swaync must release
# org.freedesktop.Notifications before noctalia claims it) and `systemctl start`
# exits 0 on a unit that is wedged. docs/adr/0022.
exec=~/.config/mango/scripts/modes/noctalia-start.sh
exec=~/.config/mango/scripts/system/gtk-apply.sh
exec=pgrep '^\.?kdeconnectd' >/dev/null || kdeconnectd
