# The key that exists ONLY in noctalia mode, because it has no analogue in the
# other two — swaync has no dock. A bind in universal/ for it would be a key
# that does nothing and exits 0 in tiling, which is the failure docs/adr/0020
# was written to avoid. docs/adr/0023.
#
# There were three. The control centre left on 2026-08-19 and the calendar on
# 2026-08-28, both the same way: the surface got a tiling implementation that
# reads the owners already here, rather than a second copy of noctalia's.
# docs/adr/0033, docs/adr/0058.
#
# NONE of these may collide with a key in universal/bind.conf. mango warns on a
# duplicate — `[WARNING] Key binding conflict` naming both files and lines — and
# then silently runs whichever was parsed first, so the warning is the only
# tell. Verified against a nested instance: it does fire, and it goes to
# mango's stderr where nothing reads it.
#
# They still go through scripts/menus/shell.sh rather than calling
# `noctalia-shell ipc call` here, so the "shell is not running" and "Target not
# found" reports live in one place. Those two are the reason a noctalia key
# cannot be trusted to have worked just because it exited 0.
bind=SUPER+SHIFT,d,spawn,~/.config/mango/scripts/menus/shell.sh dock
