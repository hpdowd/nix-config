# Noctalia mode — noctalia-shell replaces waybar AND swaync. docs/adr/0020.
#
# Unlike tiling this is NOT the shared flat look: noctalia's own UI is
# rounded, gapped and animated, and square hard-edged windows underneath it read
# as two desktops stacked. docs/adr/0022.
source=./universal/settings.conf
source=./universal/bind.conf
source=./universal/rule.conf
source=./universal/monitor.conf
source=./universal/tag.conf
source=./universal/autostart.conf
source=./universal/bind-shared.conf
source=./noctalia/bind.conf
source=./noctalia/autostart.conf
# GENERATED from modules/home/palette.nix. No trailing comment: nothing else
# in these configs uses one, so mango is not known to strip it, and a bad
# source= path is skipped in silence.
source=./universal/colors-noctalia.conf

# Everything below OVERRIDES what the sources above set. mango's parser is
# last-wins and processes `source=` inline at its position — verified against a
# nested instance, not assumed (docs/gotchas.md → Desktop). Move a line above a
# `source=` and it is silently discarded.

# --- Shape ------------------------------------------------------------------
# 12px to match noctalia's own `bar.frameRadius`. smartgaps is OFF, unlike
# tiling: a lone window that snapped flat to the screen edge would drop the
# whole look exactly when there is one thing to look at. no_border_when_single
# is 0 in both modes and must stay there — docs/gotchas.md → Desktop → mango.
border_radius=12
no_radius_when_single=0
gappih=8
gappiv=8
gappoh=12
gappov=12
smartgaps=0
borderpx=2
no_border_when_single=0
# palette.nix `overlay` (bg2) and `accent`; the flat modes use `surface` (bg1),
# which is invisible against `base` at 2px.

# --- Motion -----------------------------------------------------------------
# The only mode with `animations=1`. Everything in universal/settings.conf's
# animation block is therefore upstream's default carried over untouched and
# never once rendered — treat these as a first tuning, not a settled one.
# zoom both ways: universal closes with a slide, which fights a rounded window.
# zoom_end_ratio 1.0 so the zoom ends at the window's real size; upstream's 0.8
# has no reason recorded and nothing here has ever displayed it.
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
zoom_initial_ratio=0.5
zoom_end_ratio=1.0
animation_duration_open=220
animation_duration_close=180
animation_duration_move=220
animation_duration_tag=260
animation_duration_focus=0
animation_curve_open=0.16,1,0.3,1
animation_curve_move=0.16,1,0.3,1
animation_curve_tag=0.16,1,0.3,1

# Floating windows only (`shadow_only_floating=1`), and `layer_shadows` stays 0:
# noctalia draws its own shadows on its own panels (`general.enableShadows`), so
# turning layer shadows on here would double every one of them. Compositor
# `blur` stays off too — this machine has a GPU that deadlocks the whole system
# on a TTM fault (docs/gotchas.md → Power), and a permanent blur pass is not the
# thing to spend that risk on.
shadows=1

# --- Layer rules ------------------------------------------------------------
# noctalia animates its own panels, notifications and OSD as it shows them, so
# mango animating the surface underneath plays two animations over one another.
# Anchored regex: matching is PCRE2 and unanchored, so a bare `noctalia-` would
# also match a namespace that merely contains it. Every namespace here is
# `<name>-<screen>`, hence the prefix rather than a list — and checks/static.sh
# asserts the prefix still matches something the shipped QML declares.
layerrule=noanim:1,layer_name:^noctalia-

bind=SUPER,Delete,spawn,~/.config/mango/scripts/menus/shell.sh lock
