# Leaving noctalia. `stop` is idempotent and errors harmlessly when the unit is
# absent, which is what makes noctalia removable without touching this.
exec=systemctl --user stop noctalia 2>/dev/null; true
exec=pkill -x dsearch 2>/dev/null; true

# WAYLE IS NOT STARTED HERE ANY MORE (docs/adr/0051). It is still installed, so
# a session that predates the switch can still have one holding an exclusive
# zone next to waybar's — and its unit would keep claiming
# org.freedesktop.Notifications ahead of swaync. `stop` covers the unit,
# `pkill` the case where wayle-restart.sh was run by hand.
#
# ANCHORED. `-f` matches whole command lines including this line's own shell, so
# an unanchored 'bin/wayle' pattern kills the shell running the pkill — the
# guard-matches-itself trap in docs/gotchas.md -> Scripts. wayle's cmdline ends
# in its verb, so the `$` goes after `shell`.
exec=systemctl --user stop wayle 2>/dev/null; true
exec=pkill -f 'bin/wayle shell$' 2>/dev/null; true

# SWAYNC IS THE NOTIFICATION DAEMON HERE. It claims
# org.freedesktop.Notifications, and the second claimant of a D-Bus name does
# not error — it just never receives one (docs/adr/0005). So it must start
# AFTER wayle is gone, which is what the two lines above buy. Restarted rather
# than guarded: this line also fires on every `reload_config`, and a swaync
# that survived a mode switch is one holding the name from the wrong mode.
exec=pkill -f '^swaync( |$)' 2>/dev/null; swaync &

# The bar. Selects the generated config for the current layout and position —
# see the script.
exec=~/.config/mango/scripts/waybar/waybar-restart.sh

# The wallpaper. Here rather than in universal/autostart.conf because noctalia
# draws its own since docs/adr/0045 — see the script's header.
exec=~/.config/mango/scripts/system/wallpaper-restore.sh
exec=~/.config/mango/scripts/system/gtk-apply.sh
exec=pgrep '^\.?kdeconnectd' >/dev/null || kdeconnectd
