# Leaving noctalia. `stop` is idempotent and errors harmlessly when the unit is
# absent, which is what makes noctalia removable without touching this.
exec=systemctl --user stop noctalia 2>/dev/null; true
exec=pkill -x dsearch 2>/dev/null; true

# waybar is retired (docs/adr/0045) but a session that predates the switch still
# has one, and it holds an exclusive zone next to wayle's. Plain `pkill waybar`,
# NOT `-f 'bin/waybar$'`: waybar's cmdline carries no path (it is invoked as
# `waybar -c … -s …`) so the anchor misses, while an unanchored comm match finds
# the wrapper `.waybar-wrapped`. Remove this line when waybar itself goes.
exec=pkill waybar 2>/dev/null; true

# SWAYNC IS DEAD IN THIS MODE. wayle is the notification daemon here — it
# claims org.freedesktop.Notifications, and the second claimant of a D-Bus name
# does not error, it just never receives one (docs/adr/0005). This must run
# BEFORE wayle starts, which is why it is the line above rather than beside it.
# Same handover, same order, as noctalia-start.sh. docs/adr/0045.
exec=pkill -f '^swaync( |$)' 2>/dev/null; true

# The bar, the wallpaper engine and the notification daemon, all one unit's
# worth of shell. Selects the layout for the current state and re-points
# config.toml — see the script.
exec=~/.config/mango/scripts/wayle/wayle-restart.sh
exec=~/.config/mango/scripts/system/gtk-apply.sh
exec=pgrep '^\.?kdeconnectd' >/dev/null || kdeconnectd
