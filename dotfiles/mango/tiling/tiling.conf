# Tiling mode
source=./universal/settings.conf
source=./universal/bind.conf
source=./universal/rule.conf
source=./universal/monitor.conf
source=./universal/tag.conf
source=./universal/autostart.conf
source=./universal/bind-shared.conf
source=./tiling/autostart.conf
# GENERATED from modules/home/palette.nix. No trailing comment: nothing else
# in these configs uses one, so mango is not known to strip it, and a bad
# source= path is skipped in silence.
source=./universal/colors-tiling.conf

animations=0
layer_animations=1
border_radius=0
no_radius_when_single=0
gappih=0
gappiv=0
gappoh=0
gappov=0
borderpx=1
no_border_when_single=1
smartgaps=1

bind=SUPER,Delete,spawn,~/.config/mango/scripts/menus/shell.sh lock
