exec-once=dbus-update-activation-environment --systemd --all
exec-once=systemctl --user start mango-session.target
exec-once=bash -c "command -v lxpolkit >/dev/null && lxpolkit"
exec-once=wl-paste --type text --watch cliphist store
exec-once=~/.config/mango/scripts/menus/network-menu.sh --warm
exec-once=bash -c "bluetoothctl devices Paired > /tmp/bt-paired.cache 2>/dev/null"
exec-once=bash -c "bluetoothctl devices > /tmp/bt-all.cache 2>/dev/null"

# NO swayosd-server line. It drew a second caps-lock overlay on top of wayle's
# in tiling and noctalia's in noctalia — nothing here ever called
# `swayosd-client`, so that overlay was its whole output. docs/adr/0047.

# NO scratch-watch.sh line either. It kept /tmp/scratch-<pad> in step with the
# focused client and signalled waybar's two scratchpad modules — which went with
# the bar (docs/adr/0042 caught their CSS outliving them). Nothing has read those
# files since, so it was an all-clients watch stream held open in both modes to
# maintain state with no reader. (Not spelling the two-word verb here: the
# reaper check in checks/static.sh greps for it by content, comments included.)
# docs/adr/0045.

# NO wallpaper line. It was `exec-once=…/wallpaper-restore.sh` here, for both
# modes, because awww was the single owner. Each mode now brings its own:
# wayle drives the engine in tiling (its unit starts awww), noctalia manages
# its own. docs/adr/0045.
