exec-once=dbus-update-activation-environment --systemd --all
exec-once=systemctl --user start mango-session.target
exec-once=bash -c "command -v lxpolkit >/dev/null && lxpolkit"
exec-once=wl-paste --type text --watch cliphist store
exec-once=~/.config/mango/scripts/menus/network-menu.sh --warm
exec-once=bash -c "bluetoothctl devices Paired > /tmp/bt-paired.cache 2>/dev/null"
exec-once=bash -c "bluetoothctl devices > /tmp/bt-all.cache 2>/dev/null"

# THE OSD. Removed on 2026-08-26 for drawing a second caps-lock overlay on top
# of wayle's, and back on 2026-08-26 because wayle no longer draws one
# (docs/adr/0051 reverses that clause of docs/adr/0047). It is the only OSD in
# tiling mode now: waybar has no equivalent, so volume, brightness and the lock
# keys have no feedback without it.
#
# STILL SECOND IN NOCTALIA, which draws its own. That was true before wayle too
# and is the cost of one line in the file that runs in both modes; the
# alternative is a per-mode copy of a daemon that is idle when unused.
exec-once=pgrep '^\.?swayosd-server' >/dev/null || swayosd-server

# NO scratch-watch.sh line either. It kept /tmp/scratch-<pad> in step with the
# focused client and signalled waybar's two scratchpad modules — which went with
# the bar (docs/adr/0042 caught their CSS outliving them). Nothing has read those
# files since, so it was an all-clients watch stream held open in both modes to
# maintain state with no reader. (Not spelling the two-word verb here: the
# reaper check in checks/static.sh greps for it by content, comments included.)
# docs/adr/0051.

# NO wallpaper line, still. It was `exec-once=…/wallpaper-restore.sh` here for
# both modes, back when awww was the single owner and noctalia's engine was off
# (docs/adr/0020). noctalia's is ON since docs/adr/0045 and stays on, so the
# restore sits in tiling/autostart.conf instead — one line, in the mode that
# wants it. docs/adr/0051.
