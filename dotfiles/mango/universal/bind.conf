# Key name reference: `xev` or `wev`
# Mod keys: super, ctrl, alt, shift, none

# Reload config
bind=SUPER,R,spawn,~/.config/mango/scripts/reload.sh

# Menu and terminal
# "Configure the bar", and each mode's bar is a different program: waybar's
# layout picker in tiling and hud, noctalia's settings panel in noctalia. Both
# keys REFUSED in noctalia mode until 2026-08-16 — correct, and still two dead
# keys out of a set that small. docs/adr/0023.
bind=SUPER,slash,spawn,~/.config/mango/scripts/menus/shell.sh settings
bind=SUPER+CTRL,slash,spawn,~/.config/mango/scripts/desktop-mode.sh
# Top/bottom is a toggle rather than a picker — two options, so a menu would
# cost more keystrokes than it saves. Shift is safe here even though it turns
# `/` into the `question` keysym: `bind=` entries are resolved to KEYCODES at
# parse time (parse_config.h: parse_key(str, false) -> find_keycodes_for_keysym)
# and matched on keycode, so the shift level is not consulted. Only `bindsym=`
# compares keysyms, and would need `question` spelled out here.
bind=SUPER+SHIFT,slash,spawn,~/.config/mango/scripts/menus/shell.sh bar
bind=SUPER,Return,spawn,foot
bind=SUPER+SHIFT,Return,spawn,kitty
# Launch Zen directly rather than `xdg-open https://`. That went through the
# mime association, so when it pointed at a nonexistent zen.desktop this key
# silently opened chromium instead. The binary is `zen-beta`, not `zen`.
bind=SUPER,b,spawn,zen-beta
# Window switcher — a PICKER, unlike SUPER+Tab, which cycles the stack blind.
# rofi in EVERY mode, including noctalia. Its own `launcher windows` reads
# `CompositorService.windows`, which `MangoService` only ever fills inside the
# `DwlIpc`-guarded `updateWindows()` — dead here, so that key listed nothing.
# rofi's window mode reads wlr-foreign-toplevel, which mango does advertise
# (`wlr_foreign_toplevel_manager_v1_create`). docs/SYSTEM.md §13.
bind=SUPER,w,spawn,rofi -show window
bind=SUPER,E,spawn,thunar

# Exit
bind=SUPER+SHIFT+CTRL,m,quit
bind=SUPER,q,killclient,

# Switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# Swap window within workspace
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down

# Window status
bind=SUPER,g,toggleglobal
bind=ALT,Tab,toggleoverview
bind=SUPER+SHIFT,o,togglefloating
bind=SUPER,a,togglemaximizescreen
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,f,togglefakefullscreen
bind=SUPER,i,minimized
bind=SUPER,O,toggleoverlay
bind=SUPER+SHIFT,i,restore_minimized
bind=ALT,z,toggle_scratchpad

# Layout control
bind=SUPER+CTRL,Return,zoom
bind=SUPER+CTRL,k,incnmaster,+1
bind=SUPER+CTRL,j,incnmaster,-1
bind=SUPER,n,switch_layout

# Scroller layout
#bind=SUPER,e,set_proportion,1.0
bind=SUPER,x,switch_proportion_preset,

# Tag/workspace navigation (adjacent)
bind=SUPER+CTRL,h,viewtoleft,0
bind=SUPER+CTRL,l,viewtoright,0

# Move window to adjacent tag (and follow)
bind=SUPER+ALT,h,tagtoleft,0
bind=SUPER+ALT,l,tagtoright,0

# Named scratchpads
bind=SUPER,bracketleft,toggle_named_scratchpad,Spotify,none,spotify
bind=SUPER,bracketright,toggle_named_scratchpad,equibop,none,equibop

# Navigate to workspace
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Move window to tag (follow to new tag)
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Move window to tag (silent - stay on current tag)
bind=SUPER+CTRL+SHIFT,1,tagsilent,1
bind=SUPER+CTRL+SHIFT,2,tagsilent,2
bind=SUPER+CTRL+SHIFT,3,tagsilent,3
bind=SUPER+CTRL+SHIFT,4,tagsilent,4
bind=SUPER+CTRL+SHIFT,5,tagsilent,5
bind=SUPER+CTRL+SHIFT,6,tagsilent,6
bind=SUPER+CTRL+SHIFT,7,tagsilent,7
bind=SUPER+CTRL+SHIFT,8,tagsilent,8
bind=SUPER+CTRL+SHIFT,9,tagsilent,9

# Monitor switch
bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right
bind=SUPER+ALT,comma,tagmon,left
bind=SUPER+ALT,period,tagmon,right

# Master area size
bind=SUPER+CTRL,comma,setmfact,-0.05
bind=SUPER+CTRL,period,setmfact,+0.05

# Gaps
bind=SUPER+SHIFT,X,incgaps,1
bind=SUPER+SHIFT,Z,incgaps,-1
bind=SUPER+SHIFT,R,togglegaps

# Move floating window
bind=CTRL+SHIFT,k,movewin,+0,-50
bind=CTRL+SHIFT,j,movewin,+0,+50
bind=CTRL+SHIFT,h,movewin,-50,+0
bind=CTRL+SHIFT,l,movewin,+50,+0

# Resize floating window
bind=CTRL+ALT,k,resizewin,+0,-50
bind=CTRL+ALT,j,resizewin,+0,+50
bind=CTRL+ALT,h,resizewin,-50,+0
bind=CTRL+ALT,l,resizewin,+50,+0

# Audio
bind=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ -l 1.5
bind=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioStop,spawn,playerctl stop
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioNext,spawn,playerctl next

# Brightness
bind=NONE,XF86MonBrightnessUp,spawn_shell,brightnessctl --class=backlight set +10%
bind=NONE,XF86MonBrightnessDown,spawn_shell,brightnessctl --class=backlight set 10%-

# Screenshots
bind=NONE,Print,spawn,~/.config/mango/scripts/system/screenshot-region.sh
bind=CTRL,Print,spawn_shell,grim - | tee ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy

# Lock screen (was SUPER+ALT,l — conflicted with tagtoright)
#bind=SUPER+SHIFT,s,spawn,lockscreen -f

# Notifications, and the session menu. Through scripts/menus/shell.sh, not
# `swaync-client` directly: the daemon is swaync in tiling and hud but
# noctalia-shell in noctalia mode, and a bind that names the wrong one is a dead
# key that still exits 0. Every mode-dependent key goes through that one table —
# docs/adr/0023.
bind=CTRL+ALT,backslash,spawn,~/.config/mango/scripts/menus/shell.sh notify
bind=CTRL+ALT,BackSpace,spawn,~/.config/mango/scripts/menus/shell.sh notify-clear
bind=SUPER+SHIFT,n,spawn,~/.config/mango/scripts/menus/shell.sh dnd

# power-menu.sh existed and was bound to nothing — reachable only from a waybar
# module that config-hud.jsonc never listed. In noctalia mode this is the
# shell's own session menu instead.
bind=SUPER,Escape,spawn,~/.config/mango/scripts/menus/shell.sh power

# Toggle balanced <-> performance, same as a waybar left-click. Fanless is not
# on this path — it is the bar's right-click. A 1.1 GHz cap with the iGPU pinned
# to 200 MHz is too large a penalty to land on by pressing a key once too often.
#
# This key used to be `spawn_shell,wlopm --off '*'` ("power off monitors"),
# which never worked and could not be made to: wlopm enumerates outputs via
# wl_output, and mango advertises no wl_output global at all, so it matched
# zero outputs and silently did nothing. wlopm is deliberately not installed
# (see modules/home/packages.nix), so the bind was dead weight rather than a
# missing dependency. Reclaimed 2026-07-31.
bind=SUPER+SHIFT,p,spawn,~/.config/mango/scripts/system/power-profile-cycle.sh

# Keep awake — hold a Wayland idle inhibitor, the only thing that stops
# swayidle's ladder from inside the session. Universal since 2026-08-18: it was
# noctalia-only while the sole inhibitor outside noctalia lived inside the
# waybar process, reachable by clicking the widget and by nothing else.
# docs/adr/0031.
bind=SUPER+SHIFT,a,spawn,~/.config/mango/scripts/menus/shell.sh keep-awake

# Control centre — every toggle above in one list, each showing the state it is
# actually in. Universal since 2026-08-19, and for the same reason keep-awake
# became universal the day before: the toggles all had owners here already, so
# menus/control-center.sh reads them rather than reimplementing noctalia's
# panel. In noctalia mode this key still reaches noctalia's own control centre —
# shell.sh routes it, so there is one key and two implementations, not two keys.
# docs/adr/0033.
bind=SUPER,c,spawn,~/.config/mango/scripts/menus/shell.sh control-center

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER,btn_middle,togglemaximizescreen,0
mousebind=SUPER+CTRL,btn_left,minimized
mousebind=SUPER+CTRL,btn_right,killclient
mousebind=SUPER+CTRL,btn_middle,togglefullscreen

# Gesture Bindings
# 3-finger
gesturebind=none,right,3,focusdir,left
gesturebind=none,left,3,focusdir,right
#gesturebind=none,up,3,focusdir,up
#gesturebind=none,down,3,focusdir,down
### 4-finger
gesturebind=none,right,4,viewtoleft_have_client
gesturebind=none,left,4,viewtoright_have_client
gesturebind=none,up,3,toggleoverview
gesturebind=none,down,3,togglefloating

# Axis Bindings
axisbind=SUPER,UP,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
axisbind=SUPER,DOWN,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ -l 1.5
axisbind=SUPER+CTRL,UP,spawn_shell,brightnessctl --class=backlight set 2%-
axisbind=SUPER+CTRL,DOWN,spawn_shell,brightnessctl --class=backlight set +2%
