# =====================================================================
# Window Rules
# =====================================================================

# --- Picture-in-Picture ---
# Float, fixed 16:9 size, snapped to bottom-right corner (offsetx/offsety are % from
# centre, ±100 = usable screen edge)
windowrule=isfloating:1,isnoborder:1,width:720,height:405,offsetx:100,offsety:100,appid:firefox,title:Picture-in-Picture
windowrule=isfloating:1,isnoborder:1,width:720,height:405,offsetx:100,offsety:100,appid:zen-beta,title:Picture-in-Picture
windowrule=isfloating:1,isnoborder:1,width:720,height:405,offsetx:100,offsety:100,appid:librewolf,title:Picture-in-Picture
windowrule=isfloating:1,isnoborder:1,width:720,height:405,offsetx:100,offsety:100,appid:chromium,title:Picture in picture
windowrule=isfloating:1,isnoborder:1,width:720,height:405,offsetx:100,offsety:100,appid:google-chrome,title:Picture in picture
windowrule=unfocused_opacity:1.0,focused_opacity:1.0,title:Picture-in-Picture
windowrule=unfocused_opacity:1.0,focused_opacity:1.0,title:Picture in picture
windowrule=animation_type_open:zoom,title:Picture-in-Picture
windowrule=animation_type_close:zoom,title:Picture-in-Picture

# --- Steam ---
# Main window floats at a reasonable size
windowrule=isfloating:1,isnosizehint:1,width:1000,height:700,appid:steam
# Steam notification position: configure inside Steam itself —
# Settings > Interface > "Notification position" dropdown — no windowrule needed
windowrule=animation_type_open:zoom,appid:steam
windowrule=animation_type_close:zoom,appid:steam

# --- System monitor ---
windowrule=isnamedscratchpad:1,width:900,height:600,appid:sysmonitor
windowrule=animation_type_open:zoom,appid:sysmonitor
windowrule=animation_type_close:zoom,appid:sysmonitor

# --- Audio / Bluetooth / Network ---
windowrule=isfloating:1,appid:pavucontrol
windowrule=width:900,height:600,appid:pavucontrol
windowrule=isfloating:1,appid:blueman-manager
windowrule=width:900,height:600,appid:blueman-manager
windowrule=isfloating:1,appid:nm-connection-editor
windowrule=width:800,height:600,appid:nm-connection-editor

# --- Calculator ---
windowrule=isfloating:1,appid:gnome-calculator
windowrule=isfloating:1,appid:galculator
windowrule=animation_type_open:zoom,appid:gnome-calculator
windowrule=animation_type_close:zoom,appid:gnome-calculator
windowrule=animation_type_open:zoom,appid:galculator
windowrule=animation_type_close:zoom,appid:galculator

# --- File pickers (xdg-desktop-portal) ---
windowrule=isfloating:1,appid:xdg-desktop-portal-gtk,title:Open File
windowrule=isfloating:1,appid:xdg-desktop-portal-gtk,title:Open Files
windowrule=isfloating:1,appid:xdg-desktop-portal-gtk,title:Save File
windowrule=isfloating:1,appid:xdg-desktop-portal-gtk,title:Save As

# --- Zoom ---
windowrule=isfloating:1,appid:zoom

# --- Nextcloud tray popup ---
windowrule=isfloating:1,isnoborder:1,width:450,height:600,offsetx:100,offsety:-100,appid:com.nextcloud.desktopclient.nextcloud,title:Nextcloud
windowrule=animation_type_open:zoom,appid:com.nextcloud.desktopclient.nextcloud,title:Nextcloud
windowrule=animation_type_close:zoom,appid:com.nextcloud.desktopclient.nextcloud,title:Nextcloud

# --- Terminals: mark for terminal swallowing ---
# When a terminal launches a GUI app, the terminal hides (swallows) behind it.
# Add any terminal emulators you use.
windowrule=isterm:1,appid:foot
windowrule=isterm:1,appid:kitty
windowrule=isterm:1,appid:Alacritty

# --- Per-app opacity overrides ---
# These apps should always appear fully opaque regardless of unfocused_opacity
windowrule=unfocused_opacity:1.0,focused_opacity:1.0,appid:^mpv$
#windowrule=unfocused_opacity:1.0,focused_opacity:1.0,appid:^foot$
windowrule=unfocused_opacity:1.0,focused_opacity:1.0,appid:^obsidian$
windowrule=unfocused_opacity:1.0,focused_opacity:1.0,appid:^zen-beta$
windowrule=unfocused_opacity:1.0,focused_opacity:1.0,appid:^firefox$

# --- polkit / misc floating ---
# The two `appid:Rofi` rules that used to sit here are GONE (2026-08-20). rofi
# 2.0 is a layer surface, not a toplevel — `mmsg get all-clients` does not list
# it while it is on screen — so neither could ever match, and `isnoborder`
# described the opposite of what happens: rofi has no compositor border to
# suppress, which is why it draws its own. The layerrules below are what reach
# it. docs/gotchas.md -> rofi.
windowrule=isfloating:1,appid:xfce-polkit

# =====================================================================
# Named Workspaces
# =====================================================================

# Named scratchpads
windowrule=isnamedscratchpad:1,width:1200,height:800,appid:Spotify
windowrule=isnamedscratchpad:1,width:1100,height:750,appid:equibop

# =====================================================================
# Layer Rules
# =====================================================================

# rofi. These two are Arch carryover that had matched nothing since the
# migration — not because the name was wrong, but because nothing invoked rofi.
# It is the right name: rofi 2.0 passes the literal "rofi" as the
# zwlr_layer_surface namespace (source/wayland/display.c:1616). Live now.
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

# swaync — notifications appear top-right (configured in swaync/config.jsonc)
# These rules control animation and strip the shadow from the panel/popups
layerrule=noshadow:1,layer_name:swaync-control-center
layerrule=noshadow:1,layer_name:swaync-notification-window
layerrule=animation_type_open:fade,layer_name:swaync-control-center
layerrule=animation_type_close:fade,layer_name:swaync-control-center
layerrule=animation_type_open:fade,layer_name:swaync-notification-window
layerrule=animation_type_close:fade,layer_name:swaync-notification-window

# Misc
layerrule=noanim:1,noblur:1,layer_name:selection
layerrule=noanim:1,layer_name:showkeys
