[colors-dark]
# Base Colors (Adapted to your config's structure)
foreground=ebdbb2    # Standard Gruvbox foreground (replaces surfaceText: #EBDBB2)
background=282828    # Standard Gruvbox background (replaces background: #282828)
# Light BG: 282828 Dark BG:1D2021
selection-foreground=ebdbb2  # Matches new foreground
selection-background=504945  # Gruvbox overlay

# ANSI 16-Color Palette
# Regular Colors (dim/normal intensity)
regular0=282828      # Black   - Gruvbox Background
regular1=cc241d      # Red     - Gruvbox Neutral Red
regular2=98971a      # Green   - Gruvbox Neutral Green
regular3=d79921      # Yellow  - Gruvbox Neutral Yellow
regular4=458588      # Blue    - Gruvbox Neutral Blue
regular5=b16286      # Magenta - Gruvbox Neutral Purple
regular6=689d6a      # Cyan    - Gruvbox Neutral Aqua
regular7=a89984      # White   - Gruvbox Gray (standard dim foreground)

# Bright Colors (high intensity)
bright0=928374       # Bright Black   - Gruvbox Light Gray
bright1=fb4934       # Bright Red     - Gruvbox Bright Red
bright2=b8bb26       # Bright Green   - Gruvbox Bright Green
bright3=fabd2f       # Bright Yellow  - Gruvbox Bright Yellow
bright4=83a598       # Bright Blue    - Gruvbox Bright Blue
bright5=d3869b       # Bright Magenta - Gruvbox Bright Purple
bright6=8ec07c       # Bright Cyan    - Gruvbox Bright Aqua
bright7=ebdbb2       # Bright White   - Gruvbox Bright Foreground
