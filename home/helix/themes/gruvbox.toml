# gruvbox.toml — Gruvbox Dark (medium contrast) for Helix
#
# Palette source: https://github.com/morhetz/gruvbox
# Full scope coverage of https://docs.helix-editor.com/themes.html
#
# Install:
#   cp gruvbox.toml ~/.config/helix/themes/gruvbox.toml
#   :theme gruvbox   (or `theme = "gruvbox"` in config.toml)
#
# Note: this shadows Helix's built-in "gruvbox" theme once placed in your
# user themes directory. Rename the file if you want to keep both around.

# -----------------------------------------------------------------------
# Syntax highlighting
# -----------------------------------------------------------------------

"attribute"                    = { fg = "aqua1", modifiers = ["italic"] }
"annotation"                   = { fg = "fg1" }
"module"                       = { fg = "aqua1" }
"namespace"                    = { fg = "fg1" }
"special"                      = { fg = "purple0" }

"type"                         = { fg = "yellow1" }
"type.builtin"                 = { fg = "yellow1", modifiers = ["italic"] }
"type.parameter"               = { fg = "orange1", modifiers = ["italic"] }
"type.enum.variant"            = { fg = "yellow1", modifiers = ["italic"] }

"constructor"                  = { fg = "purple1" }

"constant"                     = { fg = "purple1" }
"constant.builtin"             = { fg = "purple1", modifiers = ["bold"] }
"constant.builtin.boolean"     = { fg = "purple1", modifiers = ["bold"] }
"constant.character"           = { fg = "aqua1" }
"constant.character.escape"    = { fg = "orange1" }
"constant.numeric"             = { fg = "purple1" }
"constant.numeric.integer"     = { fg = "purple1" }
"constant.numeric.float"       = { fg = "purple1" }
"constant.macro"                = { fg = "aqua1" }

"string"                       = { fg = "green1" }
"string.regexp"                = { fg = "orange1" }
"string.special"                = { fg = "orange1" }
"string.special.path"          = { fg = "green1" }
"string.special.url"           = { fg = "green1", modifiers = ["underlined"] }
"string.special.symbol"        = { fg = "yellow1" }

"comment"                       = { fg = "gray", modifiers = ["italic"] }
"comment.line.documentation"   = { fg = "fg4", modifiers = ["italic"] }
"comment.block.documentation"  = { fg = "fg4", modifiers = ["italic"] }
"comment.unused"                = { fg = "gray", modifiers = ["italic", "crossed_out"] }

"variable"                      = { fg = "fg1" }
"variable.builtin"              = { fg = "orange1", modifiers = ["italic"] }
"variable.parameter"            = { fg = "blue1", modifiers = ["italic"] }
"variable.other.member"         = { fg = "blue1" }
"variable.other.member.private" = { fg = "blue1", modifiers = ["italic"] }

"label"                          = { fg = "red1" }

"punctuation"                   = { fg = "orange1" }
"punctuation.delimiter"         = { fg = "fg3" }
"punctuation.bracket"           = { fg = "fg3" }
"punctuation.special"           = { fg = "orange1" }

"keyword"                        = { fg = "red1" }
"keyword.control.conditional"   = { fg = "red1" }
"keyword.control.repeat"        = { fg = "red1" }
"keyword.control.import"        = { fg = "aqua1" }
"keyword.control.return"        = { fg = "red1" }
"keyword.control.exception"     = { fg = "red1" }
"keyword.operator"               = { fg = "purple1" }
"keyword.directive"              = { fg = "aqua1" }
"keyword.function"                = { fg = "red1" }
"keyword.storage.type"            = { fg = "red1" }
"keyword.storage.modifier"        = { fg = "orange1" }

"operator"                        = { fg = "purple1" }

"function"                        = { fg = "green1" }
"function.builtin"                = { fg = "yellow1" }
"function.method"                 = { fg = "green1" }
"function.method.private"         = { fg = "green1", modifiers = ["italic"] }
"function.macro"                   = { fg = "blue1" }
"function.special"                  = { fg = "orange1" }

"tag"                                = { fg = "aqua1" }
"tag.builtin"                        = { fg = "aqua1", modifiers = ["bold"] }

"definition"                         = { underline = { color = "aqua1", style = "line" } }

# -----------------------------------------------------------------------
# Diagnostics
# -----------------------------------------------------------------------

"diagnostic"              = { underline = { color = "orange1", style = "curl" } }
"diagnostic.hint"         = { underline = { color = "blue1", style = "curl" } }
"diagnostic.info"         = { underline = { color = "aqua1", style = "curl" } }
"diagnostic.warning"      = { underline = { color = "yellow1", style = "curl" } }
"diagnostic.error"        = { underline = { color = "red1", style = "curl" } }
"diagnostic.unnecessary"  = { modifiers = ["dim"] }
"diagnostic.deprecated"   = { modifiers = ["crossed_out"] }

"warning" = { fg = "yellow1" }
"error"   = { fg = "red1" }
"info"    = { fg = "aqua1" }
"hint"    = { fg = "blue1" }

"tabstop" = { bg = "bg2" }

# -----------------------------------------------------------------------
# Diff / version control
# -----------------------------------------------------------------------

"diff.plus"           = { fg = "green1" }
"diff.plus.gutter"     = { fg = "green1" }
"diff.minus"           = { fg = "red1" }
"diff.minus.gutter"    = { fg = "red1" }
"diff.delta"           = { fg = "yellow1" }
"diff.delta.moved"     = { fg = "purple1" }
"diff.delta.conflict"  = { fg = "orange1" }
"diff.delta.gutter"    = { fg = "yellow1" }

# -----------------------------------------------------------------------
# Markup (Markdown, etc.)
# -----------------------------------------------------------------------

"markup.heading"          = { fg = "aqua1", modifiers = ["bold"] }
"markup.heading.marker"   = { fg = "gray" }
"markup.heading.1"        = { fg = "red1", modifiers = ["bold"] }
"markup.heading.2"        = { fg = "orange1", modifiers = ["bold"] }
"markup.heading.3"        = { fg = "yellow1", modifiers = ["bold"] }
"markup.heading.4"        = { fg = "green1", modifiers = ["bold"] }
"markup.heading.5"        = { fg = "blue1", modifiers = ["bold"] }
"markup.heading.6"        = { fg = "purple1", modifiers = ["bold"] }

"markup.list.unnumbered"  = { fg = "red1" }
"markup.list.numbered"    = { fg = "orange1" }
"markup.list.checked"     = { fg = "green1", modifiers = ["crossed_out"] }
"markup.list.unchecked"   = { fg = "yellow1" }

"markup.bold"             = { modifiers = ["bold"] }
"markup.italic"           = { modifiers = ["italic"] }
"markup.strikethrough"    = { modifiers = ["crossed_out"] }

"markup.link.url"         = { fg = "green1", modifiers = ["underlined"] }
"markup.link.label"       = { fg = "blue1" }
"markup.link.text"        = { fg = "red1" }

"markup.quote"            = { fg = "gray", modifiers = ["italic"] }
"markup.raw"              = { fg = "red1" }
"markup.raw.inline"       = { fg = "orange1", bg = "bg1" }
"markup.raw.block"        = { bg = "bg1" }

# -----------------------------------------------------------------------
# Interface
# -----------------------------------------------------------------------

"ui.background"            = { bg = "bg0" }
"ui.background.separator"  = { fg = "bg3" }

"ui.cursor"                 = { fg = "bg1", bg = "fg1" }
"ui.cursor.normal"          = { fg = "bg1", bg = "gray" }
"ui.cursor.insert"          = { fg = "bg1", bg = "blue0" }
"ui.cursor.select"          = { fg = "bg1", bg = "orange0" }
"ui.cursor.match"           = { fg = "fg3", bg = "bg3" }
"ui.cursor.primary"         = { fg = "bg1", bg = "fg3" }
"ui.cursor.primary.normal"  = { fg = "bg1", bg = "fg3" }
"ui.cursor.primary.insert"  = { fg = "bg1", bg = "blue1" }
"ui.cursor.primary.select"  = { fg = "bg1", bg = "orange1" }

"ui.debug.breakpoint"       = { fg = "red1" }
"ui.debug.active"           = { fg = "yellow1" }

"ui.gutter"                 = { bg = "bg0" }
"ui.gutter.selected"        = { bg = "bg0_s" }

"ui.linenr"                 = { fg = "bg4" }
"ui.linenr.selected"        = { fg = "yellow1", modifiers = ["bold"] }

"ui.statusline"             = { fg = "fg1", bg = "bg2" }
"ui.statusline.inactive"    = { fg = "fg4", bg = "bg1" }
"ui.statusline.normal"      = { fg = "bg0", bg = "fg3", modifiers = ["bold"] }
"ui.statusline.insert"      = { fg = "bg0", bg = "blue1", modifiers = ["bold"] }
"ui.statusline.select"      = { fg = "bg0", bg = "orange1", modifiers = ["bold"] }
"ui.statusline.separator"   = { fg = "bg4" }

"ui.bufferline"             = { fg = "fg1", bg = "bg1" }
"ui.bufferline.active"      = { fg = "bg0", bg = "yellow0", modifiers = ["bold"] }
"ui.bufferline.background"  = { bg = "bg2" }

"ui.popup"                  = { fg = "fg1", bg = "bg1" }
"ui.popup.info"             = { fg = "fg2", bg = "bg2" }

"ui.picker.header"                = { fg = "fg2", bg = "bg2" }
"ui.picker.header.column"         = { underline = { style = "line" } }
"ui.picker.header.column.active"  = { modifiers = ["bold"], underline = { style = "line" } }

"ui.window"                 = { bg = "bg1" }
"ui.help"                   = { fg = "fg1", bg = "bg1" }

"ui.text"                   = { fg = "fg1" }
"ui.text.focus"             = { fg = "green1", bg = "bg1" }
"ui.text.inactive"          = { fg = "fg4" }
"ui.text.info"              = { fg = "fg0" }
"ui.text.directory"         = { fg = "blue1" }

"ui.virtual.ruler"                = { bg = "bg1" }
"ui.virtual.whitespace"           = { fg = "bg2" }
"ui.virtual.indent-guide"         = { fg = "bg2" }
"ui.virtual.inlay-hint"           = { fg = "gray", bg = "bg0_s" }
"ui.virtual.inlay-hint.parameter" = { fg = "blue1", bg = "bg0_s" }
"ui.virtual.inlay-hint.type"      = { fg = "yellow1", bg = "bg0_s" }
"ui.virtual.wrap"                 = { fg = "bg3" }
"ui.virtual.jump-label"           = { fg = "purple1", modifiers = ["bold"] }

"ui.menu"           = { fg = "fg1", bg = "bg2" }
"ui.menu.selected"  = { fg = "bg0", bg = "green1", modifiers = ["bold"] }
"ui.menu.scroll"    = { fg = "fg3", bg = "bg1" }

"ui.selection"          = { bg = "bg2" }
"ui.selection.primary"  = { bg = "bg3" }

"ui.highlight"            = { bg = "bg2" }
"ui.highlight.frameline"  = { bg = "bg1" }

"ui.cursorline.primary"    = { bg = "bg0_s" }
"ui.cursorline.secondary"  = { bg = "bg0_s" }
"ui.cursorcolumn.primary"  = { bg = "bg0_s" }
"ui.cursorcolumn.secondary" = { bg = "bg0_s" }

# -----------------------------------------------------------------------
# Palette — canonical gruvbox dark, medium contrast
# -----------------------------------------------------------------------

[palette]
bg0    = "#282828" # main background
bg0_s  = "#32302f" # soft background (cursorline, gutter accents)
bg1    = "#3c3836"
bg2    = "#504945"
bg3    = "#665c54"
bg4    = "#7c6f64"

fg0 = "#fbf1c7"
fg1 = "#ebdbb2" # main foreground
fg2 = "#d5c4a1"
fg3 = "#bdae93"
fg4 = "#a89984"

gray = "#928374"

red0    = "#cc241d" # neutral
red1    = "#fb4934" # bright
green0  = "#98971a"
green1  = "#b8bb26"
yellow0 = "#d79921"
yellow1 = "#fabd2f"
blue0   = "#458588"
blue1   = "#83a598"
purple0 = "#b16286"
purple1 = "#d3869b"
aqua0   = "#689d6a"
aqua1   = "#8ec07c"
orange0 = "#d65d0e"
orange1 = "#fe8019"
