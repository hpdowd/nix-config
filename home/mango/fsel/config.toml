# fsel — Gruvbox Orange (tiling mode)
# Terminal bg/fg come from foot, whose colours are generated by programs.foot

highlight_color = "rgb(215, 153, 33)"   # gruvbox orange/yellow #D79921
cursor = "█"

pin_color = "rgb(215, 153, 33)"
pin_icon = "*"

terminal_launcher = "foot -e"

[app_launcher]
filter_desktop = true
filter_actions = false
list_executables_in_path = false
match_mode = "fuzzy"
ranking_mode = "frecency"
pinned_order = "ranking"
