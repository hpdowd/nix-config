# Shared settings across all desktop modes

# Window effects
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=0
layer_shadows=0
shadow_only_floating=1
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadowscolor=0x000000ff

focused_opacity=1.0
unfocused_opacity=1.0

# Animation curves/durations (toggled per mode via animations=)
animation_type_open=zoom
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=180
animation_duration_open=160
animation_duration_tag=160
animation_duration_close=120
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller layout
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-stack layout
new_is_master=1
default_mfact=0.65
default_nmaster=1

# Overview
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
axis_bind_apply_timeout=6
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=1
snap_distance=25
cursor_size=24
cursor_theme=Capitaine Cursors (Gruvbox)
drag_tile_to_tile=1
circle_layout=scroller,tile
single_scratchpad=0
xwayland_persistence=1

# Keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=gb

# Trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# Mouse
mouse_natural_scrolling=0

# Base appearance (colors shared across tiling/hud)
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
rootcolor=0x282828ff
maximizescreencolor=0xb8bb26ff
urgentcolor=0xfb4934ff
scratchpadcolor=0xd3869bff
globalcolor=0xd3869bff
overlaycolor=0x8ec07cff

