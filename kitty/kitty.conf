# ── Font ─────────────────────────────────────────────────────────────
font_family      Hack Nerd Font Mono
bold_font        0xProto Nerd Font Mono Bold
italic_font      0xProto Nerd Font Mono Italic
symbol_map       U+E000-U+F8FF,U+100000-U+10FFFF Symbols Nerd Font Mono
font_size        11.0
#disable_ligatures always
force_ltr        no

# ── Cursor ───────────────────────────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0

# ── Window ───────────────────────────────────────────────────────────
window_padding_width 15 20

# ── Scrollback ───────────────────────────────────────────────────────
scrollback_lines 10000

# ── Bell ─────────────────────────────────────────────────────────────
enable_audio_bell no

# ── Neovim integration ───────────────────────────────────────────────
# Kitty keyboard protocol — lets neovim see Ctrl+Shift+x and similar combos
modify_font underline_position 2
wayland_titlebar_color background

# ── Colors ───────────────────────────────────────────────────────────
# BEGIN_KITTY_THEME
# Gruvbox Dark
include gruvbox-orange.conf
# END_KITTY_THEME
include tabs.conf
include active-theme.conf
