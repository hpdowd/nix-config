<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  power-profiles-tlp. Upstream power-profiles-daemon gates ActiveProfile behind
  polkit; this is one seat and one admin, so bus policy carries it instead:
  wheel sets the profile, everyone else may only read it.

  Reads stay open to `default` because a denied Get is indistinguishable from a
  daemon that is not running. The client renders nothing either way, which is
  the failure this daemon exists to remove. docs/adr/0026.

  Note for editors: an XML comment may not contain a double hyphen, and dbus
  rejects the whole file if one does. checks/static.sh parses this.
-->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.UPower.PowerProfiles"/>
  </policy>

  <policy group="wheel">
    <allow send_destination="org.freedesktop.UPower.PowerProfiles"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.freedesktop.UPower.PowerProfiles"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="org.freedesktop.UPower.PowerProfiles"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
    <allow send_destination="org.freedesktop.UPower.PowerProfiles"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
